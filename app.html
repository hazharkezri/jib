<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JIB">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JIB — Super-App</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@700;800&family=Vazirmatn&family=Noto+Naskh+Arabic&family=Noto+Sans+SC&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d;--bg2:#0a0f1e;--card:#101828;--card2:#0b1224;--card3:#141d38;
  --line:#1c2740;--line2:#243154;
  --primary:#6c5cff;--primary2:#8b7bff;--accent:#00d4a0;--gold:#ffc94d;
  --red:#ff5c7a;--blue:#4da3ff;--text:#eef2ff;--muted:#9aa4c0;--muted2:#6b7594;
  --grad:linear-gradient(135deg,#6c5cff,#00d4a0);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Vazirmatn','Noto Naskh Arabic','Noto Sans SC',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:'Vazirmatn','Inter','Noto Naskh Arabic',sans-serif}
.app{max-width:520px;margin:0 auto;padding:20px 18px 130px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.av{width:44px;height:44px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:18px;flex-shrink:0}
.greet{flex:1;min-width:0}
.greet b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet small{color:var(--muted);font-size:12px;display:block}
.top-right{display:flex;align-items:center;gap:8px}
.lang{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;max-width:70px}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:32px;height:32px;color:var(--muted);cursor:pointer;font-size:15px;display:grid;place-items:center}
.pts-badge{background:rgba(0,212,160,.1);border:1px solid rgba(0,212,160,.3);color:var(--accent);font-size:12px;font-weight:700;padding:6px 10px;border-radius:20px;white-space:nowrap}
.points-card{position:relative;overflow:hidden;border-radius:20px;padding:20px;margin-bottom:6px;background:linear-gradient(135deg,#6c5cff,#8a6cff 55%,#00d4a0)}
.points-card::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.points-card small{opacity:.9;font-size:13px;font-weight:500}
.points-card b{font-size:38px;font-family:'Sora',sans-serif;display:block;margin:4px 0}
.pq-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pq{background:rgba(0,0,0,.22);border-radius:10px;padding:5px 11px;font-size:12px;font-weight:600}
.stitle{font-size:13px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:600;margin:22px 4px 12px;display:flex;align-items:center;gap:8px}
.stitle::after{content:"";flex:1;height:1px;background:var(--line)}
.stitle .more{margin-left:auto;color:var(--primary2);font-size:12px;text-transform:none;letter-spacing:0;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.kpi b{font-size:20px;display:block;margin-top:6px}
.kpi .chg{font-size:12px;font-weight:700;display:inline-block;margin-top:4px}
.green{color:var(--accent)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 4px;text-align:center;cursor:pointer;transition:.2s}
.qa:hover,.qa:active{background:var(--card3);border-color:var(--primary);transform:scale(.97)}
.qa .e{font-size:22px}
.qa small{font-size:11px;color:var(--muted);display:block;margin-top:6px;font-weight:500}
.ticker{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:130px;flex-shrink:0}
.tk .s{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.tk .s .upd{color:var(--accent)}
.tk b{font-size:18px;display:block;margin:5px 0}
.tk .chg{font-size:12px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.row .ic{width:40px;height:40px;border-radius:11px;background:var(--card3);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.row .t{flex:1;min-width:0}
.row .t b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px}
.row .val{font-weight:700;font-size:15px;flex-shrink:0}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:.2s}
.task input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}
.task .t{flex:1}.task .t b{font-size:14px;display:block}.task .t small{color:var(--muted);font-size:11px}
.task.done .t b{text-decoration:line-through;opacity:.5}
.task .del{color:var(--muted2);border:none;background:none;font-size:16px;cursor:pointer;padding:4px}
.health-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.h-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.h-card b{font-size:24px}
.circle{--p:60;--c:var(--accent);width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#1c2740 0);display:grid;place-items:center;position:relative;flex-shrink:0}
.circle::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.circle span{position:relative;font-size:13px;font-weight:700}
.news{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:8px}
.news .nimg{height:120px;background:linear-gradient(135deg,var(--card3),var(--line2));display:grid;place-items:center;font-size:38px}
.news .nbody{padding:14px 16px}
.news .nbody .cat{font-size:11px;color:var(--primary2);font-weight:700;text-transform:uppercase}
.news .nbody b{font-size:15px;display:block;margin:5px 0}
.news .nbody small{color:var(--muted);font-size:12px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:520px;max-width:100%;background:rgba(10,15,30,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;z-index:40;padding:8px 4px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
.bnav::-webkit-scrollbar{display:none}
.bnav button{flex:0 0 auto;min-width:46px;background:none;border:none;color:var(--muted2);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 5px;cursor:pointer;position:relative;transition:.2s}
.bnav button .e{font-size:20px;line-height:1}
.bnav button small{font-size:9px;font-weight:600;white-space:nowrap}
.bnav button.active{color:var(--primary)}
.bnav button.active::before{content:"";position:absolute;top:-8px;width:28px;height:3px;border-radius:3px;background:var(--grad)}
.modal{position:fixed;inset:0;background:rgba(3,5,10,.75);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal.show{display:flex}
.sheet{background:var(--card);width:520px;max-width:100%;border-radius:24px 24px 0 0;padding:8px 22px 26px;max-height:88vh;overflow:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 16px}
.sheet h3{font-size:18px;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--card3);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;font-family:inherit;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--grad);color:#fff;border:none;border-radius:14px;padding:15px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-ghost{background:var(--card3);border:1px solid var(--line2)}
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:var(--card3);border:1px solid var(--primary);color:#fff;padding:13px 22px;border-radius:14px;z-index:70;font-size:14px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:.3s;opacity:0;pointer-events:none}
.toast.show{opacity:1;bottom:140px}
.empty{color:var(--muted2);text-align:center;font-size:13px;padding:26px 16px;border:1px dashed var(--line);border-radius:14px}
.fade-in{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== budget chart ===== */
.chartbar{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:10px}
.chartbar .cb{flex:1;background:var(--grad);border-radius:4px 4px 0 0;opacity:.85;min-height:4px;position:relative}
.chartbar .cb b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap}

/* ===== shopping ===== */
.budget-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.budget-prog{height:10px;border-radius:5px;background:var(--card3);overflow:hidden;margin:8px 0}
.budget-prog>i{display:block;height:100%;background:var(--grad);border-radius:5px;transition:.4s}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.switch-row .t{flex:1}

/* ===== AI chat ===== */
.fab{position:fixed;bottom:150px;right:max(12px,calc(50% - 260px + 18px));z-index:45;width:56px;height:56px;border-radius:50%;background:var(--grad);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 10px 30px rgba(108,92,255,.5);display:grid;place-items:center}
[dir=rtl] .fab{right:auto;left:max(12px,calc(50% - 260px + 18px))}
.chat{display:flex;flex-direction:column;height:70vh}
.chat-msgs{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bubble.user{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card3);border:1px solid var(--line);border-bottom-left-radius:6px}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;background:var(--card3);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font-family:inherit;font-size:14px}
.chat-input input:focus{outline:none;border-color:var(--primary)}
.chat-input button{background:var(--grad);border:none;color:#fff;border-radius:12px;width:46px;font-size:18px;cursor:pointer}
.typing{color:var(--muted);font-size:13px;padding:4px 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chipq{background:var(--card3);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 14px;font-size:12px;cursor:pointer}

/* ===== share card ===== */
.share-card{background:linear-gradient(135deg,#151c3a,#0d1326);border:1px solid var(--line2);border-radius:20px;padding:26px;text-align:center;margin:10px 0}
.share-card .slogo{font-family:'Sora';font-size:30px;font-weight:800;color:var(--accent)}
.share-card .spts{font-size:46px;font-family:'Sora';font-weight:800;color:var(--gold);margin:6px 0}
.share-card .slv{font-size:14px;color:var(--muted)}
</style>
</head>

<div class="app" id="appView">
  <div class="top">
    <div class="av">ج</div>
    <div class="greet">
      <b id="greetName">Good morning 👋</b>
      <small id="greetDate"></small>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="bellBtn" title="Notifications">🔔</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
      <span class="pts-badge">⭐ <span id="ptsToday">+0</span></span>
      <select class="lang" id="langSel">

      </select>
    </div>
  </div>

  <div class="points-card fade-in">
    <small id="lblPoints">Your points</small>
    <b id="points">0</b>
    <div class="pq-row">
      <span class="pq" id="lblLv"></span>
      <span class="pq" id="lblStreak"></span>
      <span class="pq" id="lblChallenge"></span>
    </div>
  </div>

  <div class="stitle"><span id="lblQuick">⚡ Quick actions</span></div>
  <div class="quick" id="quickBar"></div>

  <div id="views"></div>
</div>

<button class="fab" id="aiFab">💬</button>
<div class="bnav" id="bnav"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

/* ============ jalali ============ */
function toJalali(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=(jy>0)?(gy+621):gy;let day=(gy2%4===0&&(gy2%100!==0||gy2%400===0))?366:365;
  day=(gy2-1)*365+Math.floor((gy2-1)/4)-Math.floor((gy2-1)/100)+Math.floor((gy2-1)/400)+(gdm[gm-1]+gd);
  gy=0;const le=jy<0||jy>0;
  let jdn=day+79;jy=33*(jdn/979);const jy2=Math.floor(jy);let leap=(jy2-((jy2/33)*33))*4/33;
  if(leap>=0&&leap<0.5)jy2++;jy=jy2;
  let dayj=jdn-979*jy/33;jy++;const jm=(dayj>=365)?0:(dayj-365);
  leap=((jy-1)%4===0)?(dayj<186?1:(dayj<366?0:1)):((dayj<186)?1:(dayj<366?0:1));
  let jd=dayj;if(leap)jd++;jm=Math.floor(jd/31);const jm2=(jd%31)+1;jm++;
  return {j:jy,m:jm,d:jm2};
}

function notifEnabled(){return 'Notification' in window && Notification.permission==='granted'}
function askNotif(){if(!('Notification' in window))return toast(t('notifOff'));if(Notification.permission==='default'){Notification.requestPermission().then(p=>{toast(p==='granted'?t('notifOn'):t('notifOff'))})}}
function fireNotif(title,body){if(notifEnabled()){try{const n=new Notification(title,{body});setTimeout(()=>n.close(),5000)}catch(e){}}}
function checkReminders(){if(!notifEnabled()||!S.reminders)return;const now=Date.now();S.reminders.forEach((r,i)=>{if(!r.done&&r.t&&r.t<=now){fireNotif(t('remDue')+r.desc,'JIB');S.reminders[i].done=true;save()}})}

let globalIRR=0;
async function fetchGold(){try{const g=await(await fetch('https://api.gold-api.com/price/XAU')).json();const gUsd=g.price;const gramUsd=gUsd/31.1035;const toman=globalIRR?gramUsd*globalIRR:gramUsd*621000;goldCard=`<div class="tk"><div class="s"><span>🥇 ${t('gold')}</span><span class="upd">●</span></div><b style="color:var(--gold)">${L==='fa'||RTL.indexOf(L)>=0?Math.round(toman).toLocaleString('en-US'):'$'+gUsd.toFixed(2)}</b><span class="chg green">${t('goldLive')}</span></div>`;myMarkets();}catch(e){}}
async function fetchCrypto(){try{const c=await(await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd',{headers:{'User-Agent':'Mozilla/5.0'}})).json();cryptoCard=`<div class="tk"><div class="s"><span>₿ BTC</span><span class="upd">●</span></div><b>$${fmt(c.bitcoin.usd)}</b><span class="chg green">▲</span></div><div class="tk"><div class="s"><span>Ξ ETH</span></div><b>$${fmt(c.ethereum.usd)}</b><span class="chg green">▲</span></div>`;myMarkets();}catch(e){}}

async function aiChat(userMsg){
  addBubble(userMsg,'user');addTyping();
  const system='You are JIB assistant, a helpful finance & daily-life assistant inside a super-app. IMPORTANT: Always answer in the language of the user: '+(({fa:'Persian (فارسی)',ar:'Arabic',ckb:'Kurdish Sorani',kmr:'Kurdish Kurmanji',ru:'Russian',es:'Spanish',fr:'French',de:'German',zh:'Chinese'})[L]||'English')+'. Be concise, friendly, practical.';
  let text='';
  try{
    const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:system},{role:'user',content:userMsg}],model:'openai'}),signal:AbortSignal.timeout(25000)});
    text=(await r.text()).trim();
  }catch(e){text=offlineAI(userMsg);}
  if(!text||text.includes('Error'))text=offlineAI(userMsg);
  removeTyping();addBubble(text,'ai');addPts(2);
}

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openTrans(){const now=new Date();openSheet(`<h3>${t('addTrans')}</h3><div class="field"><label>${t('type')}</label><select id="trType"><option value="inc">${t('inc')}</option><option value="exp">${t('exp')}</option><option value="trans">${t('transfer')}</option></select></div><div class="field"><label>${t('amount')}</label><input type="number" id="trAmt"></div><div class="field"><label>${t('label')}</label><input id="trLabel"></div><div class="field"><label>${t('desc')}</label><input id="trDesc"></div><button class="btn" id="trSave">${t('save')}</button><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>`);$('#trSave').onclick=()=>{const amt=+$('#trAmt').value||0;if(!amt)return;const typ=$('#trType').value;const tr={amt,type:typ,inc:typ==='inc',exp:typ==='exp',trans:typ==='trans',label:$('#trLabel').value||(typ==='inc'?t('inc'):typ==='exp'?t('exp'):t('transfer')),desc:$('#trDesc').value,ts:Date.now(),mt:new Date().getMonth()};if(typ==='exp')S.money.balance-=amt;else if(typ==='inc')S.money.balance+=amt;S.txn.push(tr);addPts(5);save();closeModal();render();toast(t('saved')+' ⭐+5')}}
function openPay(type){const map={bill:['🧾',t('bills')],charge:['📶',t('charge')],toll:['🛣️',t('tollW')],fine:['👮',t('fineW')]};const [ic,label]=map[type];openSheet(`<h3>${ic} ${label}</h3>${type==='bill'?`<div class="field"><label>${t('category')}</label><select id="cat"><option>⚡</option><option>💧</option><option>🔥</option><option>📞</option><option>🌐</option></select></div>`:''}<div class="field"><label>${t('amount')}</label><input type="number" id="pAmt"></div><button class="btn" id="pSave">${t('pay')} ${label}</button><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>`);$('#pSave').onclick=()=>{const amt=+$('#pAmt').value||0;if(amt){S.payments.push({ic,label,amt,time:new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})});S.txn.push({ic,amt,exp:true,label,desc:label,ts:Date.now(),mt:new Date().getMonth()});addPts(8);save();closeModal();render();toast(t('pay')+' ✓ ⭐+8')}}}
function openTask(){openSheet(`<h3>${t('addTask')}</h3><div class="field"><label>${t('desc')}</label><input id="tkDesc"></div><div class="field"><label>${t('time')}</label><input id="tkTime" placeholder="09:00"></div><button class="btn" id="tkSave">${t('save')}</button><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>`);$('#tkSave').onclick=()=>{const d=$('#tkDesc').value;if(!d)return;S.tasks.push({desc:d,time:$('#tkTime').value,done:false});addPts(3);save();closeModal();render();toast(t('saved')+' ⭐+3')}}
function openRem(){openSheet(`<h3>${t('addReminder')}</h3><div class="field"><label>${t('desc')}</label><input id="rmDesc"></div><div class="field"><label>${t('time')}</label><input type="datetime-local" id="rmTime"></div><button class="btn" id="rmSave">${t('save')}</button><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>`);$('#rmSave').onclick=()=>{const d=$('#rmDesc').value;const tt=$('#rmTime').value;if(!d||!tt)return;const ts=new Date(tt).getTime();S.reminders.push({desc:d,time:new Date(ts).toLocaleString(),ts,done:false});addPts(3);save();closeModal();render();fireNotif(t('addReminder')+': '+d,'JIB');toast(t('saved')+' ⭐+3')}}
function openItem(){openSheet(`<h3>${t('addItem')}</h3><div class="field"><label>${t('desc')}</label><input id="itDesc"></div><button class="btn" id="itSave">${t('add')}</button><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button>`);$('#itSave').onclick=()=>{const d=$('#itDesc').value;if(!d)return;S.list.push({desc:d,done:false});save();closeModal();render();toast(t('saved'))}}

/* ============ settings ============ */
function openSettings(){
  openSheet(`<h3>⚙️ ${t('settings')}</h3>
  <div class="stitle" style="margin-top:0">${t('budget')}</div>
  <div class="field"><label>${t('amount')}</label><input type="number" id="budAmt" value="${S.budget||''}"></div>
  <button class="btn btn-ghost" id="budSave">${t('save')} ${t('budget')}</button>
  <div class="stitle">${t('notifications')}</div>
  <button class="btn btn-ghost" id="notifBtn">${t('permissions')}</button>
  <div class="stitle" id="installTitle" style="${beforeInstallPrompt?'':'display:none'}">${t('install')}</div>
  <button class="btn btn-ghost" id="installBtn" style="${beforeInstallPrompt?'':'display:none'}">📲 ${t('install')}</button>
  <div class="stitle">${t('backup')}</div>
  <div class="inline"><button class="btn btn-ghost" id="expBtn">📤 ${t('export')}</button></div>
  <div style="height:6px"></div>
  <button class="btn btn-ghost" id="impBtn">📥 ${t('import')}</button>
  <input type="file" id="impFile" accept="application/json" style="display:none">
  <div class="stitle">${t('jalali')}</div>
  <button class="btn btn-ghost" id="jalBtn">${t('jalali')}</button>`);
  $('#budSave').onclick=()=>{S.budget=+$('#budAmt').value||0;save();toast(t('saved'));render()};
  $('#notifBtn').onclick=askNotif;
  $('#installBtn').onclick=()=>{if(beforeInstallPrompt){beforeInstallPrompt.prompt();beforeInstallPrompt=null}$('#installTitle').style.display='none';$('#installBtn').style.display='none'};
  $('#expBtn').onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jib-backup.json';a.click();toast(t('backupDone'))};
  $('#impBtn').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);for(const k in S)S[k]=d[k]||S[k];save();render();closeModal();toast(t('restored'))}catch(err){toast(t('saved'))}};r.readAsText(f)};
  $('#jalBtn').onclick=()=>{const j=toJalali(new Date().getFullYear(),new Date().getMonth()+1,new Date().getDate());toast(MONTHS_FA[j.m-1]+' '+j.d+' '+j.j)};
}

/* ============ init ============ */
function daily(){const d=new Date().toDateString();if(S.lastDay!==d){S.lastDay=d;S.streak++;addPts(10);toast('⭐ +10')}}
let countDown=null;
$('#langSel').onchange=e=>{L=e.target.value;document.documentElement.dir=(RTL.indexOf(L)>=0)?'rtl':'ltr';document.documentElement.lang=L;save();render()};
$('#settingsBtn').onclick=openSettings;
$('#bellBtn').onclick=askNotif;
$('#aiFab').onclick=openAI;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function loadApp(){daily();setGreet();render();fetchFX();fetchGold();fetchCrypto();setInterval(()=>{fetchFX();fetchGold();fetchCrypto()},300000);setInterval(checkReminders,30000)}
function setGreet(){const gd=new Date();const j=toJalali(gd.getFullYear(),gd.getMonth()+1,gd.getDate());let dateStr=gd.toLocaleDateString((RTL.indexOf(L)>=0)?'fa-IR':'en-US',{weekday:'long',day:'numeric',month:'long'});if((L==='fa'||L==='ckb'||L==='ar'))dateStr=MONTHS_FA[j.m-1]+' '+j.d+'، '+j.j;$('#greetDate').textContent=dateStr}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
let beforeInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();beforeInstallPrompt=e;toast(t('install'))});
loadApp();
</script>
</body>
</html>
