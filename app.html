<style>
:root{
  --bg:#05070d;--bg2:#0b1020;--card:#0d1629;--card2:#0b1224;--card3:#16203c;
  --line:#1d2b4a;--line2:#2a3a66;
  --primary:#7c3aed;--primary2:#a78bfa;--accent:#22d3ee;--gold:#facc15;
  --red:#fb7185;--blue:#38bdf8;--pink:#fb7185;--orange:#fb923c;--amber:#fbbf24;
  --text:#f1f5ff;--muted:#a5b0d9;--muted2:#6f7ba6;
  --grad:linear-gradient(135deg,#7c3aed,#ec4899 50%,#f59e0b);
  --grad-soft:linear-gradient(135deg,rgba(124,58,237,.16),rgba(236,72,153,.12) 50%,rgba(245,158,11,.1));
  --shadow:0 10px 34px rgba(0,0,0,.42);
  --glow:0 0 0 1px rgba(124,58,237,.35),0 14px 44px rgba(124,58,237,.24);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Vazirmatn','Noto Naskh Arabic','Noto Sans SC',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
[dir=rtl] body{font-family:'Vazirmatn','Inter','Noto Naskh Arabic',sans-serif}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(95px);opacity:.5;z-index:-1;pointer-events:none}
body::before{width:420px;height:420px;background:radial-gradient(circle,#7c3aed,transparent 70%);top:-120px;left:-90px;animation:floatA 16s ease-in-out infinite}
body::after{width:460px;height:460px;background:radial-gradient(circle,#ec4899,transparent 70%);bottom:-140px;right:-100px;animation:floatB 19s ease-in-out infinite}
@keyframes floatA{50%{transform:translate(40px,50px) scale(1.12)}}
@keyframes floatB{50%{transform:translate(-40px,-40px) scale(1.1)}}
.app{max-width:520px;margin:0 auto;padding:20px 18px 130px;min-height:100vh;position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;animation:slideDown .5s ease both}
.av{width:46px;height:46px;border-radius:16px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:19px;flex-shrink:0;box-shadow:0 8px 22px rgba(124,58,237,.4)}
.greet{flex:1;min-width:0}
.greet b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.greet small{color:var(--muted);font-size:12px;display:block}
.top-right{display:flex;align-items:center;gap:8px}
.lang{background:rgba(13,22,41,.7);border:1px solid var(--line);border-radius:12px;padding:7px 10px;color:var(--muted);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;max-width:86px;backdrop-filter:blur(8px);transition:.2s;display:inline-flex;align-items:center;gap:6px;line-height:1}
.lang:focus,.lang:hover{border-color:var(--primary);color:var(--text);box-shadow:var(--glow)}
#langFlag{font-size:16px}
.kurd{position:relative;display:inline-block;width:22px;height:14px;border-radius:2px;overflow:hidden;vertical-align:-2px;background:repeating-linear-gradient(180deg,#0f7a40 0px, #0f7a40 4.66px, #fdfdfd 4.66px, #fdfdfd 9.33px, #da0f21 9.33px, #da0f21 14px)}
.kurd::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:7px;height:7px;background:#fcca1b;border-radius:50%}
#langCode{letter-spacing:.6px}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lang-btn{display:flex;align-items:center;gap:12px;background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:13px 15px;cursor:pointer;transition:.2s;font-family:inherit}
.lang-btn:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--glow)}
.lang-btn .lf{font-size:26px}
.lang-btn .lt{display:flex;flex-direction:column}
.lang-btn .lt b{font-size:14px;color:var(--text)}
.lang-btn .lt small{font-size:11px;color:var(--muted)}
.lang-btn.active{border-color:var(--accent);background:linear-gradient(170deg,rgba(34,211,238,.12),var(--card2))}
.lang-btn.active::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:800}
#langModal .sheet{width:260px;border-radius:22px 22px 0 0;padding:8px 10px 16px}
#langModal h3{font-size:15px;margin-bottom:10px;text-align:center}
#langModal .lang-grid{grid-template-columns:1fr;gap:3px}
#langModal .lang-btn{padding:8px 10px;border-radius:10px;gap:10px}
#langModal .lang-btn .lf{font-size:17px;width:28px;text-align:center;flex-shrink:0}
#langModal .lang-btn .lt b{font-size:13px}
.icon-btn{background:rgba(13,22,41,.7);border:1px solid var(--line);border-radius:12px;width:36px;height:36px;color:var(--muted);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.2s;backdrop-filter:blur(8px)}
.icon-btn:hover,.icon-btn.active{color:var(--text);border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--glow)}
.pts-badge{background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(124,58,237,.16));border:1px solid rgba(34,211,238,.35);color:var(--accent);font-size:12px;font-weight:700;padding:7px 12px;border-radius:22px;white-space:nowrap;box-shadow:0 4px 14px rgba(34,211,238,.14)}
.points-card{position:relative;overflow:hidden;border-radius:22px;padding:22px;margin-bottom:6px;background:linear-gradient(135deg,#7c3aed,#ec4899 50%,#f59e0b);animation:popIn .6s ease both;box-shadow:0 18px 46px rgba(124,58,237,.3)}
.points-card::after{content:"";position:absolute;right:-50px;top:-50px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.09);animation:spin 22s linear infinite}
.points-card::before{content:"";position:absolute;left:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.06)}
.points-card small{opacity:.92;font-size:13px;font-weight:500;position:relative;z-index:1}
.points-card b{font-size:40px;font-family:'Sora',sans-serif;display:block;margin:4px 0;position:relative;z-index:1;letter-spacing:1px}
.pq-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;position:relative;z-index:1}
.pq{background:rgba(0,0,0,.22);border-radius:12px;padding:6px 13px;font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
.stitle{font-size:13px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;font-weight:700;margin:24px 4px 12px;display:flex;align-items:center;gap:8px}
.stitle::after{content:"";flex:1;height:1px;background:var(--line)}
.stitle .more{margin-left:auto;color:var(--primary2);font-size:12px;text-transform:none;letter-spacing:0;cursor:pointer;transition:.2s}
.stitle .more:hover{color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden;transition:.25s}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--kpc,rgba(124,58,237,.18)),transparent 70%);opacity:.6;transition:.3s}
.kpi:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--glow)}
.kpi small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}
.kpi b{font-size:21px;display:block;margin-top:6px;font-family:'Sora',sans-serif;position:relative}
.kpi .chg{font-size:12px;font-weight:700;display:inline-block;margin-top:4px}
.week{display:flex;gap:6px;margin-top:18px;position:relative;z-index:1}
.wdot{flex:1;text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 2px;color:#fff}
.wdot small{display:block;font-size:10px;opacity:.75;text-transform:uppercase}
.wdot b{font-size:15px;font-family:'Sora',sans-serif;display:block}
.wdot.now{background:rgba(255,255,255,.28);border-color:#fff}
.wdot.now span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin-top:3px}
.backbar{display:flex;align-items:center;gap:6px;padding:8px 12px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;cursor:pointer;width:fit-content;color:var(--primary);font-weight:600}
.backbar span{font-size:18px;line-height:1}
.backbar small{font-size:13px}
.lvlbar{position:relative;margin-top:18px;height:10px;border-radius:8px;background:rgba(255,255,255,.2);overflow:visible;z-index:1}
.lvlbar i{display:block;height:100%;border-radius:8px;background:#fff}
.lvlbar span{position:absolute;right:0;top:-16px;font-size:10px;font-weight:700;color:#fff;opacity:.9}
.rewards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.r-card{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;position:relative;overflow:hidden;transition:.25s}
.r-card::after{content:"";position:absolute;right:-24px;top:-24px;width:70px;height:70px;border-radius:50%;background:var(--rpc);opacity:.18}
.r-card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--glow)}
.r-card .e{font-size:26px}
.r-card b{display:block;margin-top:6px;font-family:'Sora',sans-serif}
.r-card small{color:var(--muted);font-size:11px;display:block}
.r-card .rv{display:inline-block;margin-top:8px;font-weight:800;color:var(--accent)}
.hero-card{--hb:linear-gradient(135deg,#7c3aed,#ec4899 55%,#f59e0b);position:relative;overflow:hidden;border-radius:26px;padding:24px 22px;margin-bottom:16px;background:var(--hb);box-shadow:0 22px 52px rgba(90,70,255,.38);animation:popIn .55s ease both}
.hero-card::before{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12);animation:spin 26s linear infinite}
.hero-card::after{content:"";position:absolute;left:-30px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-card .hc-row{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;gap:10px}
.hero-card .hc-lab{font-size:13px;opacity:.9;font-weight:600}
.hero-card .hc-big{font-size:34px;font-family:'Sora',sans-serif;font-weight:800;letter-spacing:1px;display:block;margin:2px 0}
.hero-card .hc-sub{font-size:12px;opacity:.85}
.hero-card .hc-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);padding:7px 13px;border-radius:14px;font-size:12px;font-weight:700;backdrop-filter:blur(4px);white-space:nowrap}
.hero-card .hc-btns{display:flex;gap:9px;margin-top:22px;position:relative;z-index:1}
.hero-card .hc-btn{flex:1;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:15px;padding:13px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;backdrop-filter:blur(6px)}
.hero-card .hc-btn:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
.green{color:var(--accent)}.red{color:var(--red)}.gold{color:var(--gold)}.blue{color:var(--blue)}.pink{color:var(--pink)}.orange{color:var(--orange)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:16px 4px;text-align:center;cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.qa::before{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:.22s}
.qa:hover,.qa:active{transform:translateY(-4px);border-color:var(--primary);box-shadow:var(--glow)}
.qa:hover::before{opacity:1}
.qa .e{font-size:24px;position:relative}
.qa small{font-size:11px;color:var(--muted);display:block;margin-top:8px;font-weight:600;position:relative}
.ticker{display:flex;gap:11px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:14px 18px;min-width:138px;flex-shrink:0;transition:.2s;cursor:default}
.tk:hover{border-color:var(--line2);transform:translateY(-2px)}
.tk .s{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.tk .s .upd{color:var(--accent)}
.tk b{font-size:19px;display:block;margin:6px 0;font-family:'Sora',sans-serif}
.tk .chg{font-size:12px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:9px;transition:.2s;animation:fade .35s ease both}
.row:hover{border-color:var(--line2);transform:translateX(2px)}
[dir=rtl] .row:hover{transform:translateX(-2px)}
.row .ic{width:42px;height:42px;border-radius:13px;background:var(--grad-soft);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.row .t{flex:1;min-width:0}
.row .t b{font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px}
.row .val{font-weight:700;font-size:15px;flex-shrink:0;font-family:'Sora',sans-serif}
.task{display:flex;align-items:center;gap:12px;background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:9px;cursor:pointer;transition:.2s;animation:fade .35s ease both}
.task:hover{border-color:var(--primary)}
.task input{width:21px;height:21px;accent-color:var(--accent);flex-shrink:0}
.task .t{flex:1}.task .t b{font-size:14px;display:block}.task .t small{color:var(--muted);font-size:11px}
.task.done .t b{text-decoration:line-through;opacity:.5}
.task.done{opacity:.65}
.task .del{color:var(--muted2);border:none;background:none;font-size:16px;cursor:pointer;padding:4px;transition:.15s}
.task .del:hover{color:var(--red)}
.health-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.h-card{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:16px;transition:.2s}
.h-card:hover{border-color:var(--primary)}
.h-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.h-card b{font-size:24px;font-family:'Sora',sans-serif}
.bar{height:7px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent)}
.circle{--p:60;--c:var(--accent);width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#1c2740 0);display:grid;place-items:center;position:relative;flex-shrink:0;transition:.4s}
.circle::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.circle span{position:relative;font-size:13px;font-weight:700}
.news{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:9px;transition:.2s}
.news:hover{border-color:var(--line2);transform:translateY(-2px)}
.news .nimg{height:120px;background:linear-gradient(135deg,var(--card3),var(--line2));display:grid;place-items:center;font-size:40px;position:relative;overflow:hidden}
.news .nimg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(124,58,237,.35),transparent 60%)}
.news .nbody{padding:14px 16px}
.news .nbody .cat{font-size:11px;color:var(--primary2);font-weight:700;text-transform:uppercase}
.news .nbody b{font-size:15px;display:block;margin:5px 0}
.news .nbody small{color:var(--muted);font-size:12px}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:520px;max-width:100%;background:rgba(10,15,30,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(120,140,220,.22);display:flex;z-index:40;padding:8px 8px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(0,0,0,.55);border-radius:22px 22px 0 0}
.bnav button{flex:1;min-width:0;background:none;border:none;color:var(--muted2);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;cursor:pointer;position:relative;transition:.22s;border-radius:16px}
.bnav button .e{font-size:21px;line-height:1;transition:.22s;filter:drop-shadow(0 2px 6px rgba(124,58,237,.18))}
.bnav button small{font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:.2px;transition:.22s}
.bnav button:hover{color:var(--text)}
.bnav button.active{color:#fff;background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(34,211,238,.22));box-shadow:inset 0 0 0 1px rgba(124,58,237,.35)}
.bnav button.active .e{transform:translateY(-2px) scale(1.14);filter:drop-shadow(0 4px 10px rgba(124,58,237,.6))}
.bnav button.active small{color:var(--text)}
.bnav button.active::after{content:"";position:absolute;top:2px;width:22px;height:3px;border-radius:3px;background:var(--grad);box-shadow:0 0 12px rgba(124,58,237,.8);animation:popIn .3s ease}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mcell{display:flex;flex-direction:column;align-items:center;gap:9px;background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:18px 8px;cursor:pointer;transition:.22s;position:relative;overflow:hidden}
.mcell::before{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:.22s}
.mcell:hover,.mcell:active{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--glow)}
.mcell:hover::before{opacity:1}
.mcell .e{font-size:26px;position:relative;filter:drop-shadow(0 3px 8px rgba(124,58,237,.25))}
.mcell small{font-size:12px;color:var(--muted);font-weight:600;position:relative}
.modal{position:fixed;inset:0;background:rgba(3,5,10,.78);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:60;animation:fade .25s ease}
.modal.show{display:flex}
.sheet{background:linear-gradient(180deg,var(--card2),#0a1020);width:520px;max-width:100%;border-radius:26px 26px 0 0;padding:8px 22px 26px;max-height:88vh;overflow:auto;animation:up .32s cubic-bezier(.2,.8,.3,1);border-top:1px solid var(--line2)}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 18px}
.sheet h3{font-size:18px;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--card3);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:13px;font-family:inherit;font-size:15px;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--grad);color:#fff;border:none;border-radius:15px;padding:15px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:6px;transition:.2s;box-shadow:0 10px 26px rgba(124,58,237,.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(124,58,237,.4)}
.btn:active{transform:translateY(0)}
.btn-ghost{background:var(--card3);border:1px solid var(--line2);box-shadow:none}

.toast.show{opacity:1;bottom:142px}
.empty{color:var(--muted2);text-align:center;font-size:13px;padding:26px 16px;border:1.5px dashed var(--line);border-radius:16px}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,58,237,.55)}70%{box-shadow:0 0 0 16px rgba(124,58,237,0)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
@keyframes shimmer{to{transform:translateX(100%)}}
.fab{animation:pulse 2.6s ease-out infinite}
.fade-in{animation:fade .45s ease both}

/* ===== budget chart ===== */
.chartbar{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:12px;padding-top:14px}
.chartbar .cb{flex:1;background:var(--grad);border-radius:6px 6px 2px 2px;opacity:.9;min-height:4px;position:relative;transition:.3s;box-shadow:0 -6px 18px rgba(124,58,237,.25)}
.chartbar .cb:hover{opacity:1;filter:brightness(1.15)}
.chartbar .cb b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap}
.svgchart{width:100%;height:150px;display:block;margin-top:12px;overflow:visible}

/* ===== shopping ===== */
.budget-box{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:10px}
.budget-prog{height:11px;border-radius:6px;background:var(--card3);overflow:hidden;margin:10px 0}
.budget-prog>i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:.5s;box-shadow:0 0 14px rgba(124,58,237,.5)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;margin-bottom:9px}
.switch-row .t{flex:1}
.switch-row small{color:var(--muted)}

/* ===== AI chat ===== */
.fab{position:fixed;bottom:150px;right:max(12px,calc(50% - 260px + 18px));z-index:45;width:58px;height:58px;border-radius:50%;background:var(--grad);border:none;color:#fff;font-size:25px;cursor:pointer;box-shadow:0 14px 36px rgba(124,58,237,.55);display:grid;place-items:center;transition:.2s}
.fab:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 18px 44px rgba(124,58,237,.7)}
.fab:active{transform:scale(.95)}
[dir=rtl] .fab{right:auto;left:max(12px,calc(50% - 260px + 18px))}
.chat{display:flex;flex-direction:column;height:70vh}
.chat-msgs{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:82%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;animation:bubbleIn .25s ease both}
@keyframes bubbleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bubble.user{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card3);border:1px solid var(--line);border-bottom-left-radius:6px}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input input{flex:1;background:var(--card3);border:1px solid var(--line);color:var(--text);border-radius:13px;padding:12px 14px;font-family:inherit;font-size:14px;transition:.2s}
.chat-input input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(124,58,237,.14)}
.chat-input button{background:var(--grad);border:none;color:#fff;border-radius:13px;width:48px;font-size:18px;cursor:pointer;transition:.2s}
.chat-input button:hover{filter:brightness(1.12)}
.typing{color:var(--muted);font-size:13px;padding:4px 2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chipq{background:var(--card3);border:1px solid var(--line);color:var(--muted);border-radius:22px;padding:8px 15px;font-size:12px;cursor:pointer;transition:.2s;font-weight:600}
.chipq:hover{border-color:var(--primary);color:var(--text);transform:translateY(-1px);box-shadow:var(--glow)}

/* ===== share card ===== */
.share-card{background:linear-gradient(135deg,#161d3f,#0d1326);border:1px solid var(--line2);border-radius:22px;padding:28px;text-align:center;margin:10px 0;position:relative;overflow:hidden}
.share-card::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(250,204,21,.08);top:-60px;right:-40px}
.share-card .slogo{font-family:'Sora';font-size:32px;font-weight:800;color:var(--accent);position:relative;z-index:1}
.share-card .spts{font-size:48px;font-family:'Sora';font-weight:800;color:var(--gold);margin:6px 0;position:relative;z-index:1}
.share-card .slv{font-size:14px;color:var(--muted);position:relative;z-index:1}
.app-footer{padding:22px 16px 96px;text-align:center;font-size:12px;color:var(--muted);direction:rtl}
.modgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 16px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;transition:.2s}
.mod:active{transform:scale(.96)}
.mod .e{font-size:24px}
.mod b{display:block;font-size:12px;font-weight:700;color:var(--text);margin-top:6px}
.catrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.catrow span{font-size:16px}
.catrow b{font-size:13px;white-space:nowrap;color:var(--text)}
.catbar{flex:1;height:8px;background:rgba(127,127,157,.14);border-radius:6px;overflow:hidden}
.catbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#7c3aed,#ec4899)}
.drawer-overlay{position:fixed;inset:0;background:rgba(5,8,18,.55);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.3s;z-index:70}
.drawer-overlay.show{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);background:linear-gradient(180deg,#0b1120,#0e1526);border-left:1px solid var(--line);z-index:71;transform:translateX(105%);transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:translateX(0)}
[dir=rtl] .drawer{right:auto;left:0;border-left:none;border-right:1px solid var(--line);transform:translateX(-105%)}
[dir=rtl] .drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:12px;padding:20px 18px;border-bottom:1px solid var(--line)}
.drawer-av{position:relative}.drawer-av .pp{width:46px;height:46px;font-size:22px}
.drawer-user{flex:1;min-width:0}
.drawer-user b{display:block;font-size:16px}.drawer-user small{color:var(--muted);font-size:12px}
.drawer-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px}
.drawer-body{flex:1;overflow-y:auto;padding:10px 12px 30px}
.dgroup{margin:14px 0 6px;padding:0 10px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.ditem{display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:14px;cursor:pointer;color:var(--text);transition:.18s}
.ditem:hover,.ditem.active{background:linear-gradient(135deg,rgba(124,58,237,.16),rgba(34,211,238,.1));color:#fff}
.ditem .e{font-size:20px;width:30px;text-align:center}
.ditem b{flex:1;font-size:14.5px;font-weight:650}
.ditem small{color:var(--muted2);font-size:12px}
.ditem.active{box-shadow:inset 0 0 0 1px rgba(124,58,237,.35)}

/* ===== living / pro polish (app) ===== */
@keyframes heroShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes livePing{0%{box-shadow:0 0 0 0 rgba(34,211,238,.55)}70%{box-shadow:0 0 0 7px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
@keyframes softPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.hero-card{background-size:160% 160%;animation:heroShift 10s ease-in-out infinite}
.kpis .kpi{animation:riseIn .5s ease both}
.kpis .kpi:nth-child(2){animation-delay:.06s}
.kpis .kpi:nth-child(3){animation-delay:.12s}
.kpis .kpi:nth-child(4){animation-delay:.18s}
.hc-chip{backdrop-filter:blur(8px)}
.pts-badge{border:1px solid rgba(250,204,21,.35);background:linear-gradient(135deg,rgba(250,204,21,.15),rgba(255,154,92,.12))}
.pq span,.pq{animation:softPulse 3s ease-in-out infinite}
.bnav button .e{transition:transform .25s cubic-bezier(.2,.7,.3,1.4)}
.fab{box-shadow:0 10px 30px rgba(124,58,237,.45)}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(124,58,237,.5);animation:livePing 2.6s ease-out infinite}
.fade-in{animation:riseIn .4s ease both}
@keyframes riseInApp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mod,.qa,.r-card,.h-card,.task,.row,.news{margin-bottom:0}

function toJalali(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;
  const gy2=(jy>0)?(gy+621):gy;let day=(gy2%4===0&&(gy2%100!==0||gy2%400===0))?366:365;
  day=(gy2-1)*365+Math.floor((gy2-1)/4)-Math.floor((gy2-1)/100)+Math.floor((gy2-1)/400)+(gdm[gm-1]+gd);
  gy=0;
  let jdn=day+79;jy=33*(jdn/979);let jy2=Math.floor(jy);let leap=(jy2-((jy2/33)*33))*4/33;
  if(leap>=0&&leap<0.5)jy2++;jy=jy2;
  let dayj=jdn-979*jy/33;jy++;let jm=(dayj>=365)?0:(dayj-365);
  leap=((jy-1)%4===0)?(dayj<186?1:(dayj<366?0:1)):((dayj<186)?1:(dayj<366?0:1));
  let jd=dayj;if(leap)jd++;jm=Math.floor(jd/31);const jm2=(jd%31)+1;jm++;
  return {j:jy,m:jm,d:jm2};
}

  const pick=(m)=>{const v=KB[m];return v[L]||v.en};

  if(/(?:health|water|sleep|step|سلامت|آب|خواب|صحة|ماء|نوم|تەندروستی|tendurist|здор|salud|sant|gesund|健康)/i.test(q))return pick('health');
  if(/(?:shopp|list|buy|خرید|شراء|کڕین|kirîn|покуп|compra|achat|einkauf|购物|清单)/i.test(q))return pick('list');
  if(/(?:curren|exchange|fx|money|dollar|usd|ارز|دلار|عملات|نرخ|currency)/i.test(q))return pick('currency');
  if(/(?:crypto|bitcoin|btc|ether|eth|کریپتو|بت[\u200c ]?کوین|عملات\s*رقمية|کرپت|加密货币|虚拟货币)/i.test(q))return pick('crypto');
  if(/(?:news|خبر|أخبار|هەواڵ|nûçe|новост|noticia|actualit|nachricht|资讯)/i.test(q))return pick('news');
  if(/(?:reward|point|level|challenge|امتیاز|جایزه|جائزة|خاڵ|xal|балл|recompensa|récompense|belohnung|积分|奖励)/i.test(q))return pick('rewards');
  if(/(?:remind|reminder|یادآور|تذكير|بیرخستنەوە|bîrxistin|напомин|recordatorio|rappel|erinnerung|提醒)/i.test(q))return pick('reminder');
  return pick('welcome');
}
async function aiChat(userMsg){
  addBubble(userMsg,'user');addTyping();
  const system='You are JIB assistant, a helpful finance & daily-life assistant inside a super-app. IMPORTANT: Always answer in the language of the user: '+(({fa:'Persian (فارسی)',ar:'Arabic',ckb:'Kurdish Sorani',kmr:'Kurdish Kurmanji',ru:'Russian',es:'Spanish',fr:'French',de:'German',zh:'Chinese'})[L]||'English')+'. Be concise, friendly, practical.';
  let text='';
  try{
    const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:system},{role:'user',content:userMsg}],model:'openai'}),signal:AbortSignal.timeout(25000)});
    text=(await r.text()).trim();
  }catch(e){text=offlineAI(userMsg);}
  if(!text||text.includes('Error'))text=offlineAI(userMsg);
  removeTyping();addBubble(text,'ai');addPts(2);
}
const chatBox=()=>`<h3>🤖 ${t('aiTitle')}</h3><div style="font-size:12px;color:var(--muted);margin:-8px 0 12px">${t('aiOff')}</div>
<div class="chips"><div class="chipq" data-q="${t('save')}">💰</div><div class="chipq" data-q="gold">🥇</div><div class="chipq" data-q="health">❤️</div><div class="chipq" data-q="plan">📅</div></div>
<div class="chat"><div class="chat-msgs" id="aiMsgs"></div><div class="chat-input"><input id="aiIn" placeholder="${t('ask')}"><button id="aiSend">➤</button></div></div>`;
function addBubble(txt,who){const m=document.getElementById('aiMsgs');if(!m)return;const d=document.createElement('div');d.className='bubble '+who;d.textContent=txt;m.appendChild(d);m.scrollTop=m.scrollHeight}
function addTyping(){const m=document.getElementById('aiMsgs');if(m){const d=document.createElement('div');d.className='typing';d.id='aiTyping';d.textContent='···';m.appendChild(d)}}
function removeTyping(){const x=document.getElementById('aiTyping');if(x)x.remove()}
function openAI(){openSheet(chatBox());addBubble('👋 '+t('ask'),'ai');
  document.querySelectorAll('.chipq').forEach(c=>c.onclick=()=>aiChat(c.dataset.q));
  const go=()=>{const v=document.getElementById('aiIn').value.trim();if(!v)return;document.getElementById('aiIn').value='';aiChat(v)};
  document.getElementById('aiSend').onclick=go;
  document.getElementById('aiIn').onkeydown=e=>{if(e.key==='Enter')go()};
}

const VIEWS=document.getElementById('views');
let cur='home';
function show(v){cur=v;render()}

function svgChart(vals,w,h,color,stroke){
  const max=Math.max(...vals,1),min=Math.min(...vals,0);
  const pad=6,range=(max-min)||1;
  const pts=vals.map((v,i)=>[(i/(vals.length-1||1))*(w-pad*2)+pad,h-pad-((v-min)/range)*(h-pad*2)-pad]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${(w-pad).toFixed(1)} ${(h-pad).toFixed(1)} L ${pad} ${(h-pad).toFixed(1)} Z`;
  const last=pts[pts.length-1];
  return `<svg class="svgchart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="sgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#sgg)"/><path d="${line}" fill="none" stroke="${color}" stroke-width="${stroke||2}" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/></svg>`;
}

function setGreet(){const gd=new Date();const j=toJalali(gd.getFullYear(),gd.getMonth()+1,gd.getDate());let dateStr=(L==='fa'||L==='ckb'||L==='ar')?(MONTHS_FA[j.m-1]+' '+j.d+'، '+j.j):gd.toLocaleDateString(LOCALE[L]||'en-US',{weekday:'long',day:'numeric',month:'long'});$('#greetDate').textContent=dateStr}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
let beforeInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();beforeInstallPrompt=e;toast(t('install'))});
$('#langFlag').innerHTML=flagHTML(L);$('#langCode').textContent=L.toUpperCase();$('#lblLang').textContent=t('lang');
loadApp();
</script>
</body>
